  WHAT IS WHO'S
    Original Chogan: Classic and Spanish rules, the AI, the board and the UI.
    Huevo Style (designed by the owner of this fork): everything tagged [HUEVO]
    in the comments. Search for "[HUEVO]" to find every piece of it.
    The queens, the Empress and the edge timer (also designed by the owner):
    everything tagged [QUEEN]. To play Huevo without them, set HUEVO_QUEENS to
    false in the engine. The Jester and Joker: everything tagged [JESTER]; set
    HUEVO_JESTERS to false to start without them (JESTER_SLEEP_TURNS and JESTER_VALUE tune the sleep). The Scouter and Adventurer:
    everything tagged [SCOUTER]; set HUEVO_SCOUTERS to false to start without them.
    The AI knows its queen matters: evaluate() adds royalTrouble() for each queen
    (threats, the edge timer, boxed in, friendly cover). Weights are in QW.

  HUEVO STYLE RULES (the design)
    1. Kings fly along a diagonal to reach a piece to capture (like Spanish).
    2. After a capture the king lands on the square right behind the piece it
       took, never farther (the "short landing").
    3. A chain may be stopped after ANY landing, not only at its end.
    4. Capture is always optional. There is no forced-capture toggle.
    5. A player who cannot move does not simply lose: the side with more pieces
       wins and equal pieces is a draw. A king counts as one piece.
    6. No capture or man move for 60 plies is a draw.
    QUEENS (Huevo only)
    7. Each side has a queen, the paler piece, starting on the second row. Her
       capture wins the game at once.
    8. She steps one square in any diagonal direction and captures like a man
       in every direction. On the far row she becomes an Empress, who flies like
       a king, takes flying chains, lands right behind each piece she takes and
       may stop after any landing.
    9. A queen or Empress on an edge square runs a 15-turn timer, reset when she
       leaves the edge. At 0 she must leave; if she cannot, her side loses.
   10. If the only legal moves are the queen's, the side counts as stuck (rule 5
       decides). A side left with only its queen gets one last move: capturing
       the last other enemy piece gives a draw, capturing the enemy queen wins,
       anything else loses.
    JESTERS (Huevo only; designed by the owner)
   11. Each side has a Jester, starting on the third row (red on square 21, black
       on square 42). It steps and captures one square in any diagonal direction.
       On the far row it becomes a Joker, which moves like a king.
       [Sleep] Each Jester starts asleep for 15 of its own side's turns (the
       number on it counts down). A sleeping Jester cannot move or capture, nobody
       is forced to capture it, but it can still be captured by choice. Set
       JESTER_SLEEP_TURNS to 0 for Jesters that are awake from the start.
   12. If a Jester or Joker can be captured, the side to move MUST capture it
       (any piece may, a Jester or Joker included). Ordinary pieces never force a
       Jester or Joker to capture them. If a piece can capture the enemy queen
       instead, nothing is forced.
   13. A forced capture comes before the edge timer. A queen or Empress at timer 0
       that moves from an edge square to another edge square has not left the
       edge, so her side loses (this also covers a forced capture that lands on
       an edge). If another piece has to make the forced capture instead, she is
       still on the edge at timer 0 and her side loses just the same. Capturing the
       enemy queen is always allowed, even at timer 0, and wins at once.
    SCOUTERS (Huevo only; designed by the owner)
   14. Each side has a Scouter, on the third row beside the Jester (red on square
       19, black on square 44). It steps one square in any diagonal direction.
   15. A Scouter's move is a chain of jumps over pieces next to it, landing right
       behind each: an ally is only hopped, an enemy is captured. Any mix, any
       number of segments, each piece at most once per move, and the chain may
       stop after any segment. On the far row (a hop included) it becomes an
       Adventurer, which also flies to the piece it jumps and still lands right
       behind it. The flight is only for the FIRST jump of a move; every later
       jump needs a piece right next to it, exactly like a Scouter. Only the
       Empress can chain flying captures.
   16. A Scouter or Adventurer that can take a Jester or Joker must (rule 12).
   17. Only captures and men's moves reset the 60-ply draw clock. Every special
       piece (queen, Jester, Scouter) and every promoted piece counts toward it.
    History note: this mode was first called "Thai". Thai lets kings chain
    several flying captures, which was not the vision, so it became Huevo.

  FILE MAP
    ENGINE START..END  rules, move generation, AI (pure logic, no screen code)
    the script after it  screen, taps, animation, settings, saving, help text
  Tests of the original project cut the engine out between the ENGINE markers,
  so keep those two marker lines exactly as they are.

<style>
  /* The board and the pieces are physical things: the same wood and the same
     dark and red pieces in both themes, a little darker at night. */
  :root {
    --ck-light: #EAD7B7; --ck-dark: #8A5A3B; --ck-frame: #5C3B26;
    --ck-p1: #2A2522; --ck-p1-rim: #4A423D; --ck-p2: #C23A3A; --ck-p2-rim: #E26A5E;
    /* [QUEEN] the queens are the paler piece of each colour */
    --ck-q1: #8D8782; --ck-q1-rim: #BDB6B0; --ck-q2: #E8928A; --ck-q2-rim: #F7C9C4;
    /* [JESTER] the violet edge of a Jester and a Joker, the same on both colours */
    --ck-jester: #B46AF2;
    /* [SCOUTER] the blue edge of a Scouter and an Adventurer */
    --ck-scout: #4FA8F0;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ck-light: #CDB794; --ck-dark: #6E4630; } }
  :root[data-theme="dark"] { --ck-light: #CDB794; --ck-dark: #6E4630; }

  .ck-top { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: center; }
  .ck-players { display: flex; gap: var(--s-2); width: 100%; max-width: 520px; }
  .ck-player {
    flex: 1; display: flex; align-items: center; gap: var(--s-2);
    background: var(--c-surface); border-radius: var(--r-md); padding: 8px 12px;
    box-shadow: var(--sh-1); border: 2px solid transparent; min-height: 44px;
    transition: border-color var(--t-mid) var(--ease), transform var(--t-mid) var(--ease);
    min-width: 0;
  }
  .ck-player--on { border-color: var(--game); transform: translateY(-2px); box-shadow: var(--sh-2); }
  .ck-player__disc { width: 18px; height: 18px; border-radius: 50%; flex: 0 0 18px; box-shadow: 0 0 0 1.5px var(--c-text-faint); }
  .ck-player__name { flex: 1; min-width: 0; font-weight: 700; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ck-player__score { font-weight: 800; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
  /* [QUEEN] the edge timers, always on display while queens are in play */
  .ck-timers { display: flex; gap: var(--s-2); width: 100%; max-width: 520px; justify-content: center; }
  .ck-timer {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0;
    background: var(--c-surface); border-radius: var(--r-md); padding: 6px 10px; box-shadow: var(--sh-1);
    border: 2px solid transparent; font-size: var(--fs-sm); font-weight: 700;
    transition: border-color var(--t-mid) var(--ease);
  }
  .ck-timer__disc { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 14px; box-shadow: 0 0 0 1.5px var(--c-text-faint); }
  .ck-timer__num { font-weight: 800; font-variant-numeric: tabular-nums; }
  .ck-timer--calm .ck-timer__num { opacity: .55; }
  .ck-timer--edge { border-color: var(--c-gold, #D9A441); }
  .ck-timer--low { border-color: #E26A5E; color: #E26A5E; }
  .ck-note { min-height: 1.4em; font-weight: 700; font-size: var(--fs-sm); color: var(--game); text-align: center; }
  .ck-boardbox { aspect-ratio: 1; }
  .ck-canvas { width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; border-radius: var(--r-md); box-shadow: var(--sh-2); }
  .ck-thinking { animation: ck-blink 900ms infinite; }
  @keyframes ck-blink { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .ck-thinking { animation: none; } }

<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script>
/* ==== ENGINE START ==== */
function CheckersEngineFactory() {
  'use strict';

  // Draughts on the 32 dark squares of an 8×8 board, stored as 64 cells: 0
  // empty, 1 and 2 the men of players 1 and 2, 3 and 4 their kings.
  // [QUEEN] Huevo with queens adds 5 and 6 (the queens of players 1 and 2) and
  // 7 and 8 (their Empresses), and four more cells after the 64: 64 and 65 are
  // the edge timers of players 1 and 2, 66 and 67 the square of each side's
  // queen or Empress (-1 once captured). A board of 64 cells has no queens at
  // all, which is how Classic, Spanish and old saved Huevo games still play. Player 1
  // starts at the bottom (rows 5-7) and moves first. Two rule sets (#357):
  // classic checkers (English draughts), where a king steps one square, and
  // Spanish draughts, which the issue asked for: kings fly along a whole
  // diagonal, and a capture must take as many pieces as possible, then as many
  // kings as possible. Either can be played with capturing optional (#391), as
  // many people play at home: a jump is then one more choice, never a duty.
  var N = 8;
  // [QUEEN] Set to false to play Huevo without queens (and without the timer).
  var HUEVO_QUEENS = true;
  // [QUEEN] Turns a queen may stand on an edge square before she must leave it
  var EDGE_TURNS = 15;
  // [JESTER] Set to false to start without Jesters (queens and the timer stay).
  var HUEVO_JESTERS = true;
  // [JESTER] Each Jester starts ASLEEP for this many of its own side's turns (0 = awake from the start).
  // A sleeping Jester cannot move or capture and nobody is forced to capture it, but it can still be
  // captured if the other side chooses. The AI also values a living Jester a little more.
  var JESTER_SLEEP_TURNS = 15;
  var JESTER_VALUE = 40;
  // [SCOUTER] The AI values a Scouter above a man (it hops allies, takes in all four directions and chains)
  // and an Adventurer above a king. Estimated weights, to be tuned by the A/B matches in the test notes.
  var SCOUTER_VALUE = 45;
  var ADVENTURER_VALUE = 20;
  // the sleep counters live in two extra board cells after the queens' cells: 68 (player 1), 69 (player 2)
  function asleep(b, p) { return b.length > 68 && (b[67 + p] | 0) > 0; }
  function jesterSleep(b, p) { return b.length > 68 ? Math.max(0, b[67 + p] | 0) : 0; }
  // [JESTER] where the Jesters start (third row, or the far corners) and how they move
  // (all four diagonals like a queen, or forward only like a man)
  var JESTER_FRONT = true;
  var JESTER_ANY_DIRECTION = true;
  // [SCOUTER] Set to false to play without Scouters and Adventurers.
  var HUEVO_SCOUTERS = true;
  var MAX_CHAIN = 16;   // a safety limit on the segments of one Scouter chain
  var ALL = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  var UP = [[-1, -1], [-1, 1]], DOWN = [[1, -1], [1, 1]];
  // Plies without a capture or a man moving before the game is drawn, so two
  // kings cannot chase each other forever: forty moves each in classic, forty
  // king moves in all in Spanish
  // [HUEVO] huevo: 60 added
  var DRAW_PLIES = { classic: 80, spanish: 40, huevo: 60 };

  // [HUEVO] Huevo kings fly like Spanish kings (rule 1)
  function flying(rules, v) { return (rules === 'spanish' || rules === 'huevo') && (isKing(v) || isEmpress(v)); }

  function owner(v) { return v === 1 || v === 3 || v === 5 || v === 7 || v === 9 || v === 11 || v === 13 || v === 15 ? 1 : v === 2 || v === 4 || v === 6 || v === 8 || v === 10 || v === 12 || v === 14 || v === 16 ? 2 : 0; }
  // [JESTER] a Jester (9, 10) moves like a man; on the far row it becomes a Joker
  // (11, 12), which moves like a king. Both MUST be captured when they can be.
  function isKing(v) { return v === 3 || v === 4 || v === 11 || v === 12 || v === 15 || v === 16; }
  function isJester(v) { return v === 9 || v === 10; }
  function isJoker(v) { return v === 11 || v === 12; }
  // [SCOUTER] a Scouter (13, 14) hops its own pieces and captures enemies; on the far row it becomes an
  // Adventurer (15, 16), which also flies. Both count as ordinary pieces for every other rule.
  function isScouter(v) { return v === 13 || v === 14; }
  function isAdventurer(v) { return v === 15 || v === 16; }
  // [QUEEN] royal pieces: the queen (5, 6) and the Empress she becomes (7, 8)
  function isQueen(v) { return v === 5 || v === 6; }
  function isEmpress(v) { return v === 7 || v === 8; }
  function isRoyal(v) { return v >= 5 && v <= 8; }
  function isEdge(i) { var r = (i / N) | 0, c = i % N; return r === 0 || r === N - 1 || c === 0 || c === N - 1; }
  // pieces of p that are not queens or Empresses
  function nonRoyal(b, p) {
    var n = 0;
    for (var i = 0; i < 64; i++) { var v = b[i]; if (v && !(v >= 5 && v <= 8) && owner(v) === p) n++; }
    return n;
  }
  function dark(i) { return (((i / N) | 0) + i % N) % 2 === 1; }
  function dirs(v) { return isKing(v) || isRoyal(v) || isScouter(v) || (JESTER_ANY_DIRECTION && isJester(v)) ? ALL : owner(v) === 1 ? UP : DOWN; }
  // [QUEEN] a queen that reaches the far row is crowned an Empress, like a man a king
  function lastRow(v, r) { return (v <= 2 || isQueen(v) || isJester(v) || isScouter(v)) && (owner(v) === 1 ? r === 0 : r === N - 1); }
  // [HUEVO] rule 2: after a capture the king lands right behind the piece
  function shortLand(rules) { return rules === 'huevo'; }
  // [HUEVO] rule 3: a chain may stop after any landing
  function midStop(rules) { return rules === 'huevo'; }
  function initial(rules) {
    var b = [];
    for (var i = 0; i < 64; i++) {
      var r = (i / N) | 0;
      b.push(!dark(i) ? 0 : r <= 2 ? 2 : r >= 5 ? 1 : 0);
    }
    // [QUEEN] one queen each, on the second row: red on square 10, black on 53
    if (rules === 'huevo' && HUEVO_QUEENS) {
      b[10] = 6; b[53] = 5;
      // [JESTER] one each: on the third row (red on square 21, black on square 42), or in the far corners
      if (HUEVO_JESTERS) { if (JESTER_FRONT) { b[21] = 10; b[42] = 9; } else { b[7] = 10; b[56] = 9; } }
      // [SCOUTER] one each, on the third row beside the Jester: red on square 19, black on square 44
      if (HUEVO_SCOUTERS) { b[19] = 14; b[44] = 13; }
      b.push(EDGE_TURNS, EDGE_TURNS, 53, 10);
      if (HUEVO_JESTERS && JESTER_SLEEP_TURNS > 0) b.push(JESTER_SLEEP_TURNS, JESTER_SLEEP_TURNS);
    }
    return b;
  }

  // Every complete jump sequence of the piece v from i. A jump that crowns a man
  // ends the move; otherwise the piece must keep jumping while it can. The board
  // has the piece lifted off its square, and captured pieces stay on it until
  // the move ends, so none can be jumped twice.
  // A flying king may cross empty squares before the piece it takes and land on
  // any empty square after it.
  function jumps(b, i, v, from, path, caps, out, rules) {
    var r = (i / N) | 0, c = i % N, p = owner(v), any = false, ds = dirs(v), fly = flying(rules, v), sl = shortLand(rules), ms = midStop(rules);
    for (var k = 0; k < ds.length; k++) {
      var dr = ds[k][0], dc = ds[k][1], r1 = r + dr, c1 = c + dc;
      // [QUEEN] an Empress flies on every hop of a chain, a king only on the first
      if (fly && (!sl || !path.length || isEmpress(v))) while (r1 >= 0 && r1 < N && c1 >= 0 && c1 < N && b[r1 * N + c1] === 0) { r1 += dr; c1 += dc; }
      if (r1 < 0 || r1 >= N || c1 < 0 || c1 >= N) continue;
        var over = r1 * N + c1;
        if (owner(b[over]) !== 3 - p || caps.indexOf(over) >= 0) continue;
      for (var r2 = r1 + dr, c2 = c1 + dc; r2 >= 0 && r2 < N && c2 >= 0 && c2 < N && b[r2 * N + c2] === 0; r2 += dr, c2 += dc) {
        var land = r2 * N + c2;
        any = true;
        var np = path.concat([land]), nc = caps.concat([over]);
        // [HUEVO] may stop after any landing, so every landing is a move of its own
        if (ms || lastRow(v, r2)) out.push({ from: from, path: np, caps: nc, crown: lastRow(v, r2) });
        if (!lastRow(v, r2)) jumps(b, land, v, from, np, nc, out, rules);
        if (!fly || sl) break;
      }
    }
    if (!any && path.length) out.push({ from: from, path: path, caps: caps, crown: false });
  }

  // All legal moves of player p. Capturing is compulsory: if any piece can
  // jump, only jumps are legal, and each runs to its end. Spanish rules then
  // keep only the jumps taking the most pieces, and of those the most kings.
  // With free set, every jump and every step is legal, and so is any jump of
  // the Spanish ones: a capture still runs to its end once started. Jumps come
  // first, so moves(...)[0].caps says whether one is open.
  // [SCOUTER] A Scouter or Adventurer moves as a CHAIN of segments. Each segment jumps ONE piece that is
  // next to it (the Adventurer flies in to it from any distance, but only on the FIRST segment) and lands right behind it. An ally is
  // only hopped over; an enemy is captured. Any mix, in any order, any number of segments, each piece
  // at most once per move, and the move may stop after any segment. A segment onto the far row
  // crowns the Scouter and ends the move. Moves without a capture go in `steps` (a hop is not a capture).
  function scoutChains(b, i, v, caps, steps) {
    var p = owner(v), fly = isAdventurer(v);
    (function rec(sq, path, took, hopped) {
      if (path.length >= MAX_CHAIN) return;
      var r = (sq / N) | 0, c = sq % N;
      for (var k = 0; k < 4; k++) {
        var dr = ALL[k][0], dc = ALL[k][1], r1 = r + dr, c1 = c + dc;
        // [SCOUTER] the Adventurer flies only on the FIRST segment of a chain; every later segment needs a piece
        // right next to it, like a Scouter. Only the Empress may fly on every hop (see jumps()).
        if (fly && !path.length) while (r1 >= 0 && r1 < N && c1 >= 0 && c1 < N && b[r1 * N + c1] === 0) { r1 += dr; c1 += dc; }
        if (r1 < 0 || r1 >= N || c1 < 0 || c1 >= N) continue;
        var over = r1 * N + c1, t = b[over];
        if (!t) continue;
        var ally = owner(t) === p;
        if (ally ? hopped.indexOf(over) >= 0 : took.indexOf(over) >= 0) continue;
        var r2 = r1 + dr, c2 = c1 + dc;
        if (r2 < 0 || r2 >= N || c2 < 0 || c2 >= N || b[r2 * N + c2] !== 0) continue;
        var land = r2 * N + c2, np = path.concat(land), nt = ally ? took : took.concat(over);
        var nh = ally ? hopped.concat(over) : hopped, cr = lastRow(v, r2);
        var mv = { from: i, path: np, caps: nt.slice(), crown: cr };
        if (nt.length) caps.push(mv); else steps.push(mv);
        if (!cr) rec(land, np, nt, nh);
      }
    })(i, [], [], []);
  }

  function movesRaw(b, p, rules, free) {
    var caps = [], steps = [];
    for (var i = 0; i < 64; i++) {
      var v = b[i];
      if (owner(v) !== p) continue;
      if ((v === 9 || v === 10) && asleep(b, p)) continue;     // [JESTER] a sleeping Jester neither moves nor captures
      b[i] = 0;
      if (v >= 13 && v <= 16) scoutChains(b, i, v, caps, steps); else jumps(b, i, v, i, [], [], caps, rules);
      b[i] = v;
      if (caps.length && !free) continue;
      var r = (i / N) | 0, c = i % N, ds = dirs(v), fly = flying(rules, v);
      for (var k = 0; k < ds.length; k++) {
        for (var rr = r + ds[k][0], cc = c + ds[k][1]; rr >= 0 && rr < N && cc >= 0 && cc < N && b[rr * N + cc] === 0; rr += ds[k][0], cc += ds[k][1]) {
          steps.push({ from: i, path: [rr * N + cc], caps: [], crown: lastRow(v, rr) });
          if (!fly) break;
        }
      }
    }
    // [HUEVO] partial-chain emission can produce the same move twice, so remove repeats
    if (midStop(rules)) {
      var seen = {}, uniq = [];
      for (var d = 0; d < caps.length; d++) {
        var key = caps[d].from + ':' + caps[d].path.join(',');
        if (!seen[key]) { seen[key] = 1; uniq.push(caps[d]); }
      }
      caps = uniq;
    }
    if (!caps.length) return steps;
    if (free) return caps.concat(steps);
    // Only Spanish makes you take the most. Classic and Huevo take what they like.
    if (rules !== 'spanish') return caps;
    var most = 0, kings = function (m) { return m.caps.filter(function (j) { return isKing(b[j]); }).length; };
    caps.forEach(function (m) { most = Math.max(most, m.caps.length); });
    caps = caps.filter(function (m) { return m.caps.length === most; });
    var mk = 0;
    caps.forEach(function (m) { mk = Math.max(mk, kings(m)); });
    return caps.filter(function (m) { return kings(m) === mk; });
  }

  // [QUEEN] Rules on top of the plain generator, only on a board with queens:
  //  - at 0 on the edge timer the queen must step off the edge; if she cannot,
  //    there is no legal move and her player loses (see stuckWinner)
  //  - if the only legal moves are the queen's (or the Empress's) and there are
  //    other pieces, the player counts as stuck
  //  - a lone queen keeps her moves: it is her one last turn
  // [JESTER] The captures that must be played: any capture that takes a Jester or
  // Joker. If any piece can take the enemy QUEEN (or Empress) instead, nothing is
  // forced at all, so the Jester can be offered as a decoy without shielding her.
  function jesterCaptures(b, ms) {
    var f = [], k, j;
    for (k = 0; k < ms.length; k++) {
      var m = ms[k];
      for (j = 0; j < m.caps.length; j++) { var t = b[m.caps[j]]; if (t >= 5 && t <= 8) return []; }
    }
    for (k = 0; k < ms.length; k++) {
      for (j = 0; j < ms[k].caps.length; j++) { var tt = b[ms[k].caps[j]]; if (tt >= 9 && tt <= 12 && !((tt === 9 || tt === 10) && asleep(b, owner(tt)))) { f.push(ms[k]); break; } }   // a sleeping Jester is not a forced target
    }
    return f;
  }
  function jesterForced(b, p, rules, free) {
    return b.length > 64 && jesterCaptures(b, movesRaw(b, p, rules, free)).length > 0;
  }
  function timerDead(b, p) { var q = b[65 + p]; return q >= 0 && b[63 + p] <= 0 && isEdge(q); }
  function moves(b, p, rules, free) {
    var ms = movesRaw(b, p, rules, free);
    if (b.length <= 64 || !ms.length) return ms;
    var jf = jesterCaptures(b, ms);          // [JESTER] takes priority over the edge timer
    if (jf.length) return jf;
    var q = b[65 + p];

  // Draws the board for the page and for the result card, from its arguments only.

    var dpr = window.devicePixelRatio || 1;
    var W = boardBox.clientWidth || 320;
    var px = Math.round(W * dpr);
    if (cv.width !== px || cv.height !== px) { cv.width = px; cv.height = px; }
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, W);
    var mine = !S.done && !busy() && !anim;
    var ps = mine ? pickState() : null;
    paintBoard(g, W, {
      board: S.board, last: anim ? null : S.last, anim: anim, trail: anim || trail, now: now || performance.now(),
      movable: mine && !sel ? movable() : null,
      picked: mine && sel ? (sel.steps.length ? sel.steps[sel.steps.length - 1] : sel.from) : -1,
      targets: ps ? ps.targets : null,
      cursor: kbOn && mine ? cur : null
    }, colors());
  }

  function startAnim(m, v, took) {
    if (C.ui.reduceMotion()) { anim = null; draw(); return; }
    anim = { m: m, v: v, took: took, t0: performance.now() };
    if (!rafOn) { rafOn = true; requestAnimationFrame(tick); }
  }
  function tick(now) {
    if (anim && now - anim.t0 < HOP_MS * anim.m.path.length) { draw(now); requestAnimationFrame(tick); return; }
    if (anim) { trail = anim; anim = null; afterMove(); }
    if (trail && now - trail.t0 < trailEnd(trail.m)) { draw(now); requestAnimationFrame(tick); return; }
    trail = null; rafOn = false; draw();
  }

  /* ------------------------------------------- the board on the result card */
  function cardPaint() {
    var board = S.board.slice(), last = S.last;
    return function (g, W, H) {
      var side = Math.min(W, H);
      g.translate((W - side) / 2, (H - side) / 2);
      paintBoard(g, side, { board: board, last: last }, colors());
    };
  }

  function busy() { return S.mode === 'ai' && S.turn === 2 && !S.done; }

  function render() {
    top.innerHTML = '';
    if (S.daily) {
      top.appendChild(el('span', { class: 'ch-badge ch-badge--accent' },
        [C.icon('calendar', 14), el('span', { text: C.t('dailyCheckers') + ' — ' + C.num(S.daily) })]));
      top.appendChild(el('span', { class: 'ch-badge', text: C.t('vsHard') }));
    } else {
      // both pickers rebuild the game, so a game in progress asks first
      var guard = function (same, go) {
        if (same) return;
        if (S.history.length && !S.done) {
          C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: go, onCancel: function () { render(); } });
          render();
          return;
        }
        go();
      };
      top.appendChild(C.ui.segmented([
        { value: 'ai', label: C.t('vsAi') }, { value: '2p', label: C.t('twoPlayers') }
      ], S.mode, function (v) {
        guard(v === S.mode, function () {
          prefs.mode = v; ctx.store.set('prefs', prefs);
          newGame(v, S.level);
        });
      }));
      top.appendChild(C.ui.segmented([
        { value: 'classic', label: C.t('classic') }, { value: 'spanish', label: C.t('spanish') },
   { value: 'huevo', label: C.t('huevo') }
      ], S.rules, function (v) {
        guard(v === S.rules, function () {
          prefs.rules = v; ctx.store.set('prefs', prefs);
          newGame(S.mode, S.level);
        });
      }));
      // [HUEVO] rule 4: always optional capture, so no toggle
      if (S.rules !== 'huevo') top.appendChild(C.ui.segmented([
        { value: 'forced', label: C.t('capForced') }, { value: 'free', label: C.t('capFree') }
      ], S.free ? 'free' : 'forced', function (v) {
        guard(v === (S.free ? 'free' : 'forced'), function () {
          prefs.free = v === 'free'; ctx.store.set('prefs', prefs);
          newGame(S.mode, S.level);
        });
      }));
      if (S.board.length > 64) top.appendChild(timersRow);
      if (S.mode === 'ai') {
        top.appendChild(C.ui.segmented([
          { value: 'easy', label: C.t('easy') }, { value: 'medium', label: C.t('medium') }, { value: 'hard', label: C.t('hard') }
        ], S.level, function (v) {
          guard(v === S.level, function () {
            prefs.level = v; ctx.store.set('prefs', prefs);
            newGame(S.mode, v);
          });
        }));
      }
    }
    drawPlayers();
    draw();
  }

  function pname(i) {
    if (i === 1) return C.state.profile.name || C.t('you');
    if (S.mode === 'ai') return C.t('rival') + ' · ' + C.t(S.level);
    return prefs.p2name || C.t('player2');
  }

  function drawPlayers() {
    playersRow.innerHTML = '';
    var n = E.count(S.board);
    for (var i = 1; i <= 2; i++) {
      (function (p) {
        var box = el('div', { class: 'ck-player' + (S.turn === p && !S.done ? ' ck-player--on' : '') }, [
          el('div', { class: 'ck-player__disc', style: { background: p === 1 ? 'var(--ck-p1)' : 'var(--ck-p2)' } }),
          el('div', { class: 'ck-player__name', text: pname(p) }),
          el('div', { class: 'ck-player__score', 'aria-label': C.t('pieces'), text: C.num(n.men[p] + n.kings[p]) })
        ]);
        if (p === 2 && S.mode === '2p' && !S.daily) {
          box.classList.add('ch-tap');
          box.addEventListener('click', renameP2);
        }
        if (p === 2 && busy()) box.classList.add('ck-thinking');
        playersRow.appendChild(box);
      })(i);
    }
    var jump = !S.done && !busy() && !S.free && E.moves(S.board, S.turn, S.rules, S.free).some(function (m) { return m.caps.length; });
    var leave = !S.done && !busy() && forcedOffEdge(S.turn);
    // [JESTER] shown only while a Jester or Joker really must be taken (never when the queen can be taken instead)
    var jf = !S.done && !busy() && E.jesterForced(S.board, S.turn, S.rules, S.free);
    note.textContent = jump ? C.t('mustJump') : jf ? C.t('mustTakeJester') : leave ? C.t('mustLeaveEdge') : '';
    paintTimers();
  }

  // [QUEEN] the queen of p is on an edge square with her timer at 0
  function forcedOffEdge(p) {
    return S.board.length > 64 && S.board[65 + p] >= 0 && S.board[63 + p] <= 0 && E.isEdge(S.board[65 + p]);
  }
  // [QUEEN] each side's timer: it counts only while her queen stands on an edge
  function paintTimers() {
    timersRow.innerHTML = '';
    if (!S || S.board.length <= 64) return;
    for (var p = 1; p <= 2; p++) {
      var q = S.board[65 + p], cd = S.board[63 + p], gone = q < 0;
      var onEdge = !gone && E.isEdge(q);
      var name = gone ? C.t('queenWord') : (E.isEmpress(S.board[q]) ? C.t('empressWord') : C.t('queenWord'));
      var cls = 'ck-timer' + (!gone && !onEdge ? ' ck-timer--calm' : '') + (onEdge ? ' ck-timer--edge' : '') + (onEdge && cd <= 3 ? ' ck-timer--low' : '');
      timersRow.appendChild(el('div', { class: cls, 'aria-label': name + ' ' + (gone ? '' : C.num(cd)) }, [
        el('div', { class: 'ck-timer__disc', style: { background: p === 1 ? 'var(--ck-q1)' : 'var(--ck-q2)' } }),
        el('span', { text: name }),
        el('span', { class: 'ck-timer__num', text: gone ? '—' : C.num(Math.max(0, cd)) })
      ]));
    }
  }
  // [QUEEN] why the game ended, for the result card
  function causeNote() {
    var k = { queen: 'causeQueen', timer: 'causeTimer', edge: 'causeEdge', stay: 'causeStay', graceFail: 'causeGrace', twoLone: 'causeLone' }[S.cause];
    return k ? C.t(k) : null;
  }

  /* ---------------------------------------------------------- moves */

  function cellAt(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    var W = r.width, pad = Math.round(W * 0.03), cell = (W - pad * 2) / 8;
    var c = Math.floor((clientX - r.left - pad) / cell), row = Math.floor((clientY - r.top - pad) / cell);
    if (c < 0 || c > 7 || row < 0 || row > 7) return -1;
    return row * 8 + c;
  }

  cv.addEventListener('click', function (e) {
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    kbOn = false;
    tapSquare(i);
  });

  // One tap: pick a piece, then the square it goes to; on a multiple jump, each
  // landing square in turn, until only one move is left and it is played
  function tapSquare(i) {
    if (!S || S.done || busy() || anim) return;
    var ps = pickState();
    if (sel && ps.targets.indexOf(i) >= 0) {
      if (E.midStop(S.rules)) {
        // [HUEVO] any dot ends the move there: the move that stops on it is already in the list
        var hits = ps.cands.filter(function (m) { return m.path.length > sel.steps.length && m.path[m.path.length - 1] === i; });
        // distinct outcomes for this square: a slide, or captures taking different pieces
        var opts = [], seenCaps = {};
        hits.forEach(function (m) {
          var key = m.caps.slice().sort().join(',');
          if (!seenCaps[key]) { seenCaps[key] = 1; opts.push(m); }
        });
        opts.sort(function (x, y) { return x.caps.length - y.caps.length; });
        if (opts.length > 1) {
          // the square can be reached in more than one way: ask which
          var labelOf = function (m, idx) {
            var same = opts.filter(function (o) { return o.caps.length === m.caps.length; });
            var base = m.caps.length ? C.t('takeChain', { n: C.num(m.caps.length) }) : C.t('justLand');
            return same.length > 1 ? base + ' · ' + String.fromCharCode(65 + same.indexOf(m)) : base;
          };
          var acts = [{ label: C.t('cancel') }];
          opts.forEach(function (m, idx) {
            acts.push({ label: labelOf(m, idx), kind: idx === opts.length - 1 ? 'primary' : undefined,
              onClick: function () { sel = null; doMove(m, true); } });
          });
          C.ui.modal({ title: C.t('chooseMove'), body: [], actions: acts });
          return;
        }
        var hit = opts[0];
        if (hit) { sel = null; doMove(hit, true); return; }
      }
      sel.steps.push(i);
      var done = pickState().cands.filter(function (m) { return m.path.length === sel.steps.length; });
      if (done.length) { var m = done[0]; sel = null; doMove(m, true); return; }
      C.feedback('tap');
      draw();
      return;
    }
    if (movable().indexOf(i) >= 0 && !(sel && sel.steps.length)) {
      sel = { from: i, steps: [] };
      C.haptic('tap');
      draw();
      return;
    }
    // a tap anywhere else drops the pick; on one of your own pieces that cannot
    // move (another piece must jump), a short buzz says why
    if (E.owner(S.board[i]) === S.turn) { C.haptic('error'); if (note.textContent) C.ui.shake(note); }
    sel = null;
    draw();
  }

  function doMove(m, byHuman) {
    var v = S.board[m.from], took = m.caps.map(function (j) { return S.board[j]; });
    var res = E.applyMove(S, m);
    if (!res) return;
    S.last = res.move;
    C.audio.sfx(m.caps.length ? (m.caps.length > 1 ? 'chain' : 'pop') : 'place');
    if (byHuman) C.haptic('tap');
    if (m.crown) C.feedback('good');
    save();
    startAnim(m, v, took);
    if (!anim) afterMove();
  }

  function afterMove() {
    drawPlayers();
    draw();
    if (S.winner >= 0) { finish(); return; }
    maybeAi();
  }

  function maybeAi() {
    stopAi();
    if (!S || S.done || S.mode !== 'ai' || S.turn !== 2) return;
    drawPlayers();
    draw();
    aiTimer = setTimeout(function () {
      aiTimer = null;
      if (!S || S.done || S.turn !== 2) return;
      var rnd = S.daily ? C.daily('checkers', S.daily + '|' + S.history.length).rng : Math.random;
      var m = E.aiMove(S.board, 2, S.level, rnd, S.rules, S.free);
      if (m) doMove(m, false);
    }, 480);
  }
  function stopAi() { if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } }

  function undo() {
    if (!S || S.done || anim) return;
    if (sel) { sel = null; draw(); return; }
    if (!S.history.length) { C.feedback('bad'); return; }
    stopAi();
    trail = null;
    E.takeBack(S);
    S.last = S.history.length ? S.history[S.history.length - 1].m : null;
    C.feedback('tap');
    drawPlayers();
    draw();
    save();
    // if the history ran out on the rival's turn, the game would stall without this
    maybeAi();
  }

  function finish() {
    S.done = true;
    sel = null;
    S.elapsed = Date.now() - S.startedAt;
    stopAi();
    drawPlayers();
    draw();
    var n = E.count(S.board), left = [0, n.men[1] + n.kings[1], n.men[2] + n.kings[2]];
    var won = S.winner === 1, tie = S.winner === 0;

    // the same reward range as reversi; in two-player the rival's level means nothing
    var base = S.mode === 'ai' ? ({ easy: 5, medium: 10, hard: 18 }[S.level] || 10) : 8;
    var coins = Math.max(2, Math.round(won ? base : base * 0.35)) + (S.daily ? 8 : 0);
    var points = Math.max(3, Math.round(won ? base * 4 : base * 1.2)) + (S.daily ? 25 : 0);

    if (S.mode === 'ai' && won) {
      C.achievements.unlock('ck-win');
      if (S.level === 'hard') C.achievements.unlock('ck-hard');
      if (left[1] === 12) C.achievements.unlock('ck-clean');
    }
    if (won) C.stats.best('checkers', 'left', left[1], false);
    if (S.daily) {
      var firstDaily = C.stats.daily('checkers', S.daily, {
        label: (won ? C.t('won') : tie ? C.t('draw') : C.t('lost')) + ' · ' + C.num(left[1]) + ' - ' + C.num(left[2]),
        win: won, diff: left[1] - left[2]
      });
      if (!firstDaily) { coins = Math.round(coins * 0.2); points = Math.round(points * 0.2); }
    }
    ctx.clearSave();

    ctx.finish({
      won: won,
      title: tie ? C.t('draw')
        : (S.mode === '2p' ? C.t('playerWon', { n: pname(S.winner) })
          : (won ? C.t('won') : C.t('lost'))),
      note: causeNote() || (tie ? C.t('drawNote') : null),
      timeMs: S.elapsed, coins: coins, points: points,
      lines: [
        { label: pname(1), value: C.num(left[1]) },
        { label: pname(2), value: C.num(left[2]) }
      ],
      shareText: 'چوگان · چکرز' +
        (S.daily ? ('\nروزانه ' + S.daily) : '') +
        '\n' + C.num(left[1]) + ' - ' + C.num(left[2]),
      paint: cardPaint(),
      onAgain: S.daily ? null : function () { newGame(S.mode, S.level); }
    });
  }

  /* ---------------------------------------------------------- save */

  ctx.autosave(function () {
    if (!S || S.done || !S.history.length) return { inProgress: false };
    return {
      s: {
        mode: S.mode, level: S.level, daily: S.daily, rules: S.rules, free: S.free,
        board: S.board, turn: S.turn, quiet: S.quiet, history: S.history, last: S.last,
        elapsed: Date.now() - S.startedAt
      },
      prefs: prefs
    };
  });
  function save() { ctx.save(); }

  function restore(v) {
    S = {
      mode: v.mode, level: v.level, daily: v.daily || null, rules: v.rules || 'classic',
      free: !v.daily && ((v.rules || 'classic') === 'huevo' || v.free === true),
      board: v.board, turn: v.turn, quiet: v.quiet || 0, history: v.history, last: v.last || null, winner: -1,
      done: false, startedAt: Date.now() - (v.elapsed || 0)
    };
    render();
    // closed right after the last move: the finished game gets its result
    E.settle(S, 3 - S.turn, false);
    if (S.winner >= 0) finish(); else maybeAi();
  }
  function validSave(sv) {
    return !!(sv && sv.s && Array.isArray(sv.s.board) && (sv.s.board.length === 64 || sv.s.board.length === 68 || sv.s.board.length === 70) &&
      Array.isArray(sv.s.history) && sv.s.history.length && (sv.s.turn === 1 || sv.s.turn === 2));
  }

  function askNew() {
    var dd = S ? S.daily : null;
    function go() {
      // inside the daily game, the same daily game again, not a normal match
      if (dd) newGame('ai', 'hard', dd);
      else newGame(S ? S.mode : prefs.mode, S ? S.level : prefs.level);
    }
    if (!S || S.done || !S.history.length) { go(); return; }
    C.ui.confirm({ title: C.t('newMatch'), body: C.t('resetWarn'), onOk: go });
  }

  function renameP2() {
    var input = el('input', {
      type: 'text', value: prefs.p2name, maxlength: '16', placeholder: C.t('player2'),
      style: { font: 'inherit', width: '100%', padding: '10px 14px', 'border-radius': 'var(--r-md)',
        border: '1px solid var(--c-line)', background: 'var(--c-surface-2)', color: 'var(--c-text)' }
    });
    C.ui.modal({
      title: C.t('renameP2'), body: [input],
      actions: [{ label: C.t('cancel') }, { label: C.t('done'), kind: 'primary', onClick: function () {
        prefs.p2name = input.value.trim().slice(0, 16);
        ctx.store.set('prefs', prefs);
        drawPlayers();
      } }]
    });
  }

  function showHelp() {
    C.ui.modal({
      title: C.t('help'),
      body: [
        el('p', { class: 'ch-dim', text: C.t('tutText1') }),
        el('p', { class: 'ch-dim', text: C.t('tutText2') }),
        el('p', { class: 'ch-dim', text: C.t('tutText3') }),
        el('p', { class: 'ch-dim', text: S.rules === 'huevo' ? C.t('rulesNotehuevo') : C.t('rulesNote') }),
        S.rules === 'huevo' ? null : el('p', { class: 'ch-dim', text: C.t('freeNote') }),
        S.rules === 'huevo' && S.board.length > 64 ? el('p', { class: 'ch-dim', text: C.t('queenNote') }) : null,
        S.rules === 'huevo' && S.board.length > 64 && E.HUEVO_JESTERS ? el('p', { class: 'ch-dim', text: C.t('jesterNote') }) : null,
        S.rules === 'huevo' && S.board.length > 64 && E.HUEVO_SCOUTERS ? el('p', { class: 'ch-dim', text: C.t('scouterNote') }) : null,
        el('h3', { style: { 'margin-top': 'var(--s-4)' }, text: C.t('keyboard') }),
        el('div', { class: 'ch-list' }, [
          kb('← ↑ → ↓', C.t('move')),
          kb('Space / Enter', C.t('play')),
          kb('Esc', C.t('cancelPick')),
          kb('U / Ctrl+Z', C.t('undoMove'))
        ])
      ].filter(Boolean),
      actions: [
        { label: C.t('tutorial'), onClick: function () { ctx.showTutorial(TUT); } },
        { label: C.t('done'), kind: 'primary' }
      ]
    });
  }
  function kb(k, what) {
    return el('div', { class: 'ch-item' }, [
      el('div', { class: 'ch-item__label', text: what }),
      el('span', { class: 'ch-badge', text: k })
    ]);
  }

  // Tutorial pictures: a strip of board squares with the same pieces
  function tutStrip(cells, arrows) {
    var s = '<svg viewBox="0 0 240 90" width="100%"><rect x="0" y="0" width="240" height="90" rx="10" fill="var(--ck-frame)"/>';
    for (var r = 0; r < 2; r++) for (var c = 0; c < 6; c++) {
      s += '<rect x="' + (12 + c * 36) + '" y="' + (9 + r * 36) + '" width="36" height="36" fill="var(--ck-' + ((r + c) % 2 ? 'dark' : 'light') + ')"/>';
    }
    cells.forEach(function (q) {
      var x = 30 + q[1] * 36, y = 27 + q[0] * 36;
      s += '<circle cx="' + x + '" cy="' + (y + 2) + '" r="14" fill="rgba(0,0,0,.35)"/><circle cx="' + x + '" cy="' + y + '" r="14" fill="var(--ck-' + q[2] + ')"/>';
      if (q[3]) s += '<path d="M' + (x - 7) + ' ' + (y + 5) + 'v-8l3.5 4 3.5-6 3.5 6 3.5-4v8z" fill="var(--c-gold)"/>';
    });
    (arrows || []).forEach(function (a) {
      s += '<path d="M' + (30 + a[1] * 36) + ' ' + (27 + a[0] * 36) + 'L' + (30 + a[3] * 36) + ' ' + (27 + a[2] * 36) + '" stroke="var(--c-gold)" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="2 7"/>';
    });
    return s + '</svg>';
  }
  var TUT = [
    { title: C.t('tutTitle1'), text: C.t('tutText1'), art: tutStrip([[1, 0, 'p1']], [[1, 0, 0, 1]]) },
    { title: C.t('tutTitle2'), text: C.t('tutText2'), art: tutStrip([[1, 1, 'p1'], [0, 2, 'p2'], [1, 3, 'p2']], [[1, 1, 0, 2]]) },
    { title: C.t('tutTitle3'), text: C.t('tutText3'), art: tutStrip([[0, 1, 'p1', 1], [1, 4, 'p2', 1]]) }
  ];

  /* ------------------------------------------------------- keyboard */

  window.addEventListener('keydown', function (e) {
    if (!S || S.done || busy()) return;
    if (document.querySelector('.ch-scrim')) return;
    var tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    var k = e.key;
    if (C.undoKey(e)) { undo(); e.preventDefault(); return; }
    // Escape drops a pick first; only with nothing picked does it leave the game
    if (k === 'Escape' && sel) { sel = null; draw(); e.preventDefault(); return; }
    // the board is a physical thing and is not mirrored in RTL, so neither are the arrows
    var d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
    if (d) {
      // the first press only shows the cursor, so its start is clear
      if (kbOn) { cur.r = C.clamp(cur.r + d[0], 0, 7); cur.c = C.clamp(cur.c + d[1], 0, 7); }
      kbOn = true;
      draw();
      e.preventDefault();
      return;
    }
    if (k === ' ' || k === 'Enter') {
      kbOn = true;
      tapSquare(cur.r * 8 + cur.c);
      e.preventDefault();
    }
  });

  C.onPause(function () { stopAi(); });
  C.onResume(function () { if (S && !S.done) maybeAi(); });

  // the board follows its slot, which changes with the window and the side column
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(boardBox);
  else window.addEventListener('resize', function () { draw(); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { draw(); });
  }

  /* ---------------------------------------------------------- start */

  var saved = ctx.loadSave();
  if (dailyDate) {
    // the daily game has its own save slot, so a half-played day goes on
    if (validSave(saved)) restore(saved.s);
    else newGame('ai', 'hard', dailyDate);
    if (C.stats.dailyDone('checkers', dailyDate)) {
      var rec = C.stats.dailyOf(dailyDate).checkers;
      C.ui.toast({ icon: 'check', title: C.t('dailyDone'), sub: rec.label });
    }
    ctx.tutorialIfNew(TUT);
  } else if (validSave(saved)) {
    if (saved.prefs) prefs = saved.prefs;
    restore(saved.s);
  } else {
    newGame(prefs.mode || 'ai', prefs.level || 'medium');
    ctx.tutorialIfNew(TUT);
  }
})();
</script>
